
! ============================================================
! MULTI-AREA IS-IS ROUTING LAB - GNS3
! Router: Khalid-R2
! Area: 49.0001
! Router Type: Level 1-2
! IS-IS Process: HARCHAOUI-CORE
! Created by Khalid HARCHAOUI
! ============================================================

enable
configure terminal

! ------------------------------------------------------------
! 1. BASIC CONFIGURATION
! ------------------------------------------------------------
hostname Khalid-R2
no ip domain lookup
ip cef

! ------------------------------------------------------------
! 2. IS-IS ROUTING PROCESS
! ------------------------------------------------------------
router isis HARCHAOUI-CORE
 net 49.0001.0000.0000.0002.00
 is-type level-1-2
 metric-style wide
 exit

! ------------------------------------------------------------
! 3. LOOPBACK INTERFACE
! ------------------------------------------------------------
interface Loopback0
 description ROUTER-ID-R2
 ip address 2.2.2.2 255.255.255.255
 ip router isis HARCHAOUI-CORE
 exit

! ------------------------------------------------------------
! 4. CONNECTION TO R1 - LEVEL 1
! ------------------------------------------------------------
interface GigabitEthernet0/0
 description TO-KHALID-R1
 ip address 10.0.10.2 255.255.255.252
 ip router isis HARCHAOUI-CORE
 duplex full
 speed 1000
 media-type gbic
 negotiation auto
 isis circuit-type level-1
 no shutdown
 exit

! ------------------------------------------------------------
! 5. CONNECTION TO R3 - LEVEL 2
! ------------------------------------------------------------
interface GigabitEthernet1/0
 description TO-KHALID-R3
 ip address 10.0.20.1 255.255.255.252
 ip router isis HARCHAOUI-CORE
 isis circuit-type level-2-only
 no shutdown
 exit

! ------------------------------------------------------------
! 6. CONNECTION TO R6 - LEVEL 2
! ------------------------------------------------------------
interface GigabitEthernet2/0
 description TO-KHALID-R6
 ip address 10.0.60.1 255.255.255.252
 ip router isis HARCHAOUI-CORE
 isis circuit-type level-2-only
 no shutdown
 exit

end
write memory
