
! ============================================================
! MULTI-AREA IS-IS ROUTING LAB - GNS3
! Router: Khalid-R4
! Area: 49.0003
! Router Type: Level 1-2
! IS-IS Process: KHAKID-CORE-4
! Created by Khalid HARCHAOUI
! ============================================================

enable
configure terminal

! ------------------------------------------------------------
! 1. BASIC CONFIGURATION
! ------------------------------------------------------------
hostname Khalid-R4
no ip domain lookup
ip cef

! ------------------------------------------------------------
! 2. IS-IS ROUTING PROCESS
! ------------------------------------------------------------
router isis KHAKID-CORE-4
 net 49.0003.0000.0000.0004.00
 is-type level-1-2
 metric-style wide
 exit

! ------------------------------------------------------------
! 3. LOOPBACK INTERFACE
! ------------------------------------------------------------
interface Loopback0
 description ROUTER-ID-R4
 ip address 4.4.4.4 255.255.255.255
 ip router isis KHAKID-CORE-4
 exit

! ------------------------------------------------------------
! 4. CONNECTION TO R3 - LEVEL 2
! ------------------------------------------------------------
interface GigabitEthernet0/0
 description TO-KHALID-R3
 ip address 10.0.30.2 255.255.255.252
 ip router isis KHAKID-CORE-4
 duplex full
 speed 1000
 media-type gbic
 negotiation auto
 isis circuit-type level-2-only
 no shutdown
 exit

! ------------------------------------------------------------
! 5. CONNECTION TO R5 - LEVEL 1
! ------------------------------------------------------------
interface GigabitEthernet1/0
 description TO-KHALID-R5
 ip address 10.0.40.1 255.255.255.252
 ip router isis KHAKID-CORE-4
 isis circuit-type level-1
 no shutdown
 exit

! ------------------------------------------------------------
! 6. CONNECTION TO R6 - LEVEL 2
! ------------------------------------------------------------
interface GigabitEthernet2/0
 description TO-KHALID-R6
 ip address 10.0.70.1 255.255.255.252
 ip router isis KHAKID-CORE-4
 isis circuit-type level-2-only
 no shutdown
 exit

end
write memory
