
! ============================================================
! MULTI-AREA IS-IS ROUTING LAB - GNS3
! Router: Khalid-R6
! Area: 49.0004
! Router Type: Level 1-2
! IS-IS Process: KHALID-CORE-6
! Created by Khalid HARCHAOUI
! ============================================================

enable
configure terminal

! ------------------------------------------------------------
! 1. BASIC CONFIGURATION
! ------------------------------------------------------------
hostname Khalid-R6
no ip domain lookup
ip cef

! ------------------------------------------------------------
! 2. IS-IS ROUTING PROCESS
! ------------------------------------------------------------
router isis KHALID-CORE-6
 net 49.0004.0000.0000.0006.00
 is-type level-1-2
 metric-style wide
 exit

! ------------------------------------------------------------
! 3. LOOPBACK INTERFACE
! ------------------------------------------------------------
interface Loopback0
 description ROUTER-ID-R6
 ip address 6.6.6.6 255.255.255.255
 ip router isis KHALID-CORE-6
 exit

! ------------------------------------------------------------
! 4. CONNECTION TO R3 - LEVEL 2
! ------------------------------------------------------------
interface GigabitEthernet0/0
 description TO-KHALID-R3
 ip address 10.0.50.2 255.255.255.252
 ip router isis KHALID-CORE-6
 duplex full
 speed 1000
 media-type gbic
 negotiation auto
 isis circuit-type level-2-only
 no shutdown
 exit

! ------------------------------------------------------------
! 5. CONNECTION TO R2 - LEVEL 2
! ------------------------------------------------------------
interface GigabitEthernet1/0
 description TO-KHALID-R2
 ip address 10.0.60.2 255.255.255.252
 ip router isis KHALID-CORE-6
 isis circuit-type level-2-only
 no shutdown
 exit

! ------------------------------------------------------------
! 6. CONNECTION TO R4 - LEVEL 2
! ------------------------------------------------------------
interface GigabitEthernet2/0
 description TO-KHALID-R4
 ip address 10.0.70.2 255.255.255.252
 ip router isis KHALID-CORE-6
 isis circuit-type level-2-only
 no shutdown
 exit

! ------------------------------------------------------------
! 7. LAN CONNECTION - PC2
! ------------------------------------------------------------
interface GigabitEthernet3/0
 description LAN-PC2
 ip address 192.168.3.1 255.255.255.0
 ip router isis KHALID-CORE-6
 no shutdown
 exit

end
write memory
