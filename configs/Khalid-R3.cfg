
! ============================================================
! MULTI-AREA IS-IS ROUTING LAB - GNS3
! Router: Khalid-R3
! Area: 49.0002
! Router Type: Level 2 Only
! IS-IS Process: HRCH-CORE
! Created by Khalid HARCHAOUI
! ============================================================

enable
configure terminal

! ------------------------------------------------------------
! 1. BASIC CONFIGURATION
! ------------------------------------------------------------
hostname Khalid-R3
no ip domain lookup
ip cef

! ------------------------------------------------------------
! 2. IS-IS ROUTING PROCESS
! ------------------------------------------------------------
router isis HRCH-CORE
 net 49.0002.0000.0000.0003.00
 is-type level-2-only
 metric-style wide
 exit

! ------------------------------------------------------------
! 3. LOOPBACK INTERFACE
! ------------------------------------------------------------
interface Loopback0
 description ROUTER-ID-R3
 ip address 3.3.3.3 255.255.255.255
 ip router isis HRCH-CORE
 exit

! ------------------------------------------------------------
! 4. CONNECTION TO R2 - LEVEL 2
! ------------------------------------------------------------
interface GigabitEthernet0/0
 description TO-KHALID-R2
 ip address 10.0.20.2 255.255.255.252
 ip router isis HRCH-CORE
 duplex full
 speed 1000
 media-type gbic
 negotiation auto
 isis circuit-type level-2-only
 no shutdown
 exit

! ------------------------------------------------------------
! 5. CONNECTION TO R4 - LEVEL 2
! ------------------------------------------------------------
interface GigabitEthernet1/0
 description TO-KHALID-R4
 ip address 10.0.30.1 255.255.255.252
 ip router isis HRCH-CORE
 isis circuit-type level-2-only
 no shutdown
 exit

! ------------------------------------------------------------
! 6. CONNECTION TO R6 - LEVEL 2
! ------------------------------------------------------------
interface GigabitEthernet2/0
 description TO-KHALID-R6
 ip address 10.0.50.1 255.255.255.252
 ip router isis HRCH-CORE
 isis circuit-type level-2-only
 no shutdown
 exit

end
write memory
