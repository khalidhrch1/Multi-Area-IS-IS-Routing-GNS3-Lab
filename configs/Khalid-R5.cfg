
! ============================================================
! MULTI-AREA IS-IS ROUTING LAB - GNS3
! Router: Khalid-R5
! Area: 49.0003
! Router Type: Level 1 Only
! IS-IS Process: KHALID-CORE-5
! Created by Khalid HARCHAOUI
! ============================================================

enable
configure terminal

! ------------------------------------------------------------
! 1. BASIC CONFIGURATION
! ------------------------------------------------------------
hostname Khalid-R5
no ip domain lookup
ip cef

! ------------------------------------------------------------
! 2. IS-IS ROUTING PROCESS
! ------------------------------------------------------------
router isis KHALID-CORE-5
 net 49.0003.0000.0000.0005.00
 is-type level-1
 metric-style wide
 exit

! ------------------------------------------------------------
! 3. LOOPBACK INTERFACE
! ------------------------------------------------------------
interface Loopback0
 description ROUTER-ID-R5
 ip address 5.5.5.5 255.255.255.255
 ip router isis KHALID-CORE-5
 exit

! ------------------------------------------------------------
! 4. CONNECTION TO R4 - LEVEL 1
! ------------------------------------------------------------
interface GigabitEthernet0/0
 description TO-KHALID-R4
 ip address 10.0.40.2 255.255.255.252
 ip router isis KHALID-CORE-5
 duplex full
 speed 1000
 media-type gbic
 negotiation auto
 isis circuit-type level-1
 no shutdown
 exit

! ------------------------------------------------------------
! 5. LAN CONNECTION - PC3
! ------------------------------------------------------------
interface GigabitEthernet1/0
 description LAN-PC3
 ip address 192.168.2.1 255.255.255.0
 ip router isis KHALID-CORE-5
 no shutdown
 exit

end
write memory
