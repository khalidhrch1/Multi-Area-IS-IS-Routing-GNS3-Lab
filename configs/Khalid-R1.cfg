
! ============================================================
! MULTI-AREA IS-IS ROUTING LAB - GNS3
! Router: Khalid-R1
! Area: 49.0001
! IS-IS Level: Level 1
! IS-IS Process: KHALID-CORE
! ============================================================

! ------------------------------------------------------------
! 1. BASIC CONFIGURATION
! ------------------------------------------------------------
hostname Khalid-R1
!
no ip domain lookup
ip cef
!

! ------------------------------------------------------------
! 2. LOOPBACK INTERFACE
! ------------------------------------------------------------
interface Loopback0
 description ROUTER-ID-R1
 ip address 1.1.1.1 255.255.255.255
 ip router isis KHALID-CORE
!

! ------------------------------------------------------------
! 3. CONNECTION TO R2 - LEVEL 1
! ------------------------------------------------------------
interface GigabitEthernet0/0
 description LINK-TO-KHALID-R2
 ip address 10.0.10.1 255.255.255.252
 ip router isis KHALID-CORE
 duplex full
 speed 1000
 media-type gbic
 negotiation auto
 isis circuit-type level-1
 no shutdown
!

! ------------------------------------------------------------
! 4. LAN CONNECTION - PC1
! ------------------------------------------------------------
interface GigabitEthernet1/0
 description LAN-PC1
 ip address 192.168.1.1 255.255.255.0
 ip router isis KHALID-CORE
 no shutdown
!

! ------------------------------------------------------------
! 5. IS-IS ROUTING PROCESS
! ------------------------------------------------------------
router isis KHALID-CORE
 net 49.0001.0000.0000.0001.00
 is-type level-1
 metric-style wide
!

! ------------------------------------------------------------
! 6. END
! ------------------------------------------------------------
end
